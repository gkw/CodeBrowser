name: Bug report
description: Report a reproducible problem with Ollama Code Browser
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Code Browser. Do not include API keys, private source code, customer data, internal hostnames, or other sensitive information.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A clear, concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Code Browser with ...
        2. Open ...
        3. Select ...
        4. See ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.6, Ubuntu 24.04, etc.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Output of python3 --version
    validations:
      required: true
  - type: input
    id: ollama
    attributes:
      label: Ollama version and model
      placeholder: Ollama version, model name, and local or Cloud connection
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove secrets, private paths, source code, and personal or customer information.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed API keys, private code, personal data, and other sensitive information.
          required: true
